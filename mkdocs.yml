site_name: URBADAPT
site_description: >-
  Open-source geospatial frameworks for city-level climate risk assessment and
  public-private adaptation cost-benefit analysis.
site_url: https://urbadapt.github.io/
site_author: Armande Aboudrar-Méda, Giacomo Falchetta
copyright: >-
  CMCC · EIEE · ECIP Division — released under
  <a href="https://github.com/URBADAPT/URBADAPT-HEAT/blob/main/LICENSE">CC0 1.0</a>

repo_url: https://github.com/URBADAPT/URBADAPT-HEAT
repo_name: URBADAPT/URBADAPT-HEAT
# Documentation pages under docs/heat/ are generated from the GitHub wiki by
# scripts/sync_wiki.py, so "edit this page" must point at the wiki, not here.
# sync_wiki.py injects a per-page wiki link instead of using edit_uri.
edit_uri: ""

theme:
  name: material
  # Emblem only — the header already renders the "URBADAPT" wordmark as site_name.
  logo: assets/logo_mark.png
  favicon: assets/favicon.png
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/URBADAPT
      name: URBADAPT on GitHub
    - icon: fontawesome/solid/envelope
      link: mailto:giacomo.falchetta@cmcc.it
      name: Contact
  generator: false

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.smartsymbols
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - tags

# Pages under heat/ are synced from https://github.com/URBADAPT/URBADAPT-HEAT/wiki
# Run `python scripts/sync_wiki.py` before `mkdocs serve` or `mkdocs build`.
nav:
  - Home: index.md
  - URBADAPT-HEAT:
      - Overview: urbadapt-heat.md
      - Installation & usage: heat/installation.md
      - Framework:
          - Framework overview: heat/framework-overview.md
          - Hazard: heat/hazard.md
          - Exposure: heat/exposure.md
          - Vulnerability: heat/vulnerability.md
          - Impact functions: heat/impact-functions.md
      - Adaptation & appraisal:
          - Adaptation pathways: heat/adaptation-pathways.md
          - Cost-benefit analysis: heat/cost-benefit-analysis.md
          - Uncertainty analysis: heat/uncertainty-analysis.md
      - Cities:
          - City configuration: heat/city-configuration.md
          - Case studies: heat/case-studies.md
  - Team: team.md
